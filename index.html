  <style>
html,body{height:100%;margin:0;font-family:'DM Sans',sans-serif;background:#ffffff;color:#0f172a}

.card{background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);border-color:#cbd5e1}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600}
.btn-primary{background:#2563eb;color:#ffffff;font-weight:600;padding:10px 20px;border-radius:10px;transition:all .15s;border:none;cursor:pointer}
.btn-primary:hover{background:#1d4ed8;box-shadow:0 2px 8px rgba(37,99,235,.2)}
.btn-secondary{background:#f1f5f9;color:#0f172a;font-weight:500;padding:10px 20px;border-radius:10px;border:1px solid #e2e8f0;transition:all .15s;cursor:pointer}
.btn-secondary:hover{background:#ffffff;border-color:#2563eb;color:#2563eb}
input,select,textarea{background:#f8fafc;border:1.5px solid #e2e8f0;color:#0f172a;border-radius:10px;padding:10px 14px;font-size:14px;outline:none;transition:all .15s;font-family:'DM Sans',sans-serif}
input:focus,select:focus,textarea:focus{border-color:#2563eb;background:#ffffff;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.progress-bar{background:#e2e8f0;border-radius:99px;height:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;transition:width .5s ease}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.toast{position:fixed;bottom:20px;right:20px;z-index:100;padding:14px 24px;border-radius:12px;font-weight:500;animation:fadeIn .3s ease;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.chart-bar{transition:height .5s ease;border-radius:4px 4px 0 0}
.shelf-spot{cursor:pointer;transition:all .2s;border-radius:10px}
.shelf-spot:hover{filter:brightness(0.95)}
.shelf-spot.highlighted{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
</style>

 <body class="h-full">

  <script>
// ===== DATA =====
const BOOKS = [

  {id:'S001',name:'Aisha Rahman',email:'aisha@uni.edu',dept:'Computer Science',standing:'Good',fines:0,blocked:false},
  {id:'S002',name:'Marcus Chen',email:'marcus@uni.edu',dept:'Chemistry',standing:'Warning',fines:15.50,blocked:false},
  {id:'S003',name:'Priya Sharma',email:'priya@uni.edu',dept:'Economics',standing:'Blocked',fines:42.00,blocked:true},
  {id:'S004',name:'James Okafor',email:'james@uni.edu',dept:'Biology',standing:'Good',fines:0,blocked:false},

let LOANS = [
  {id:'L001',bookId:'B001',studentId:'S001',borrowDate:'2025-01-10',dueDate:'2025-01-24',returned:false,renewed:0},
  {id:'L002',bookId:'B002',studentId:'S002',borrowDate:'2025-01-05',dueDate:'2025-01-19',returned:false,renewed:1},
  {id:'L003',bookId:'B003',studentId:'S003',borrowDate:'2024-12-15',dueDate:'2024-12-29',returned:false,renewed:0},
  {id:'L004',bookId:'B007',studentId:'S001',borrowDate:'2025-01-12',dueDate:'2025-01-26',returned:false,renewed:0},
  {id:'L005',bookId:'B004',studentId:'S004',borrowDate:'2025-01-08',dueDate:'2025-01-22',returned:true,renewed:0},

const NOTIFICATIONS = [
  {id:'N001',type:'due',msg:'Due date reminder sent to Aisha Rahman for "Intro to Algorithms"',time:'2h ago',read:false},
  {id:'N002',type:'stock',msg:'"Principles of Economics" is now out of stock — 3 students waiting',time:'4h ago',read:false},
  {id:'N003',type:'overdue',msg:'Marcus Chen overdue on "Organic Chemistry" — fine accruing',time:'1d ago',read:true},

const RESEARCH_PHASES = [

  {id:'R2',phase:'Literature Review',progress:65,milestone:'Read 20 papers',notes:'14/20 papers reviewed'},

const AI_RESPONSES = [
  "Based on your topic, I recommend searching IEEE Xplore and ACM Digital Library. Try keywords: 'library automation', 'AI cataloging', 'NLP information retrieval'. Consider narrowing to a specific library type.",

  "Consider these related topics that might inform your research: digital preservation, metadata standards, user behavior analytics in OPAC systems, and machine learning for recommendation engines.",
];

  'biochemistry':{books:['B002','B008'],related:['molecular biology','enzymology','pharmacology','genetics']},

// ===== STATE =====
let state = {
  role: 'admin', // 'admin' | 'student'
  currentStudent: STUDENTS[0],
  adminPage: 'dashboard',
  studentPage: 'home',
  searchQuery: '',
  inventoryFilter: 'All',
  showAddBookModal: false,
  showFineModal: null,
  toastMsg: '',
  toastType: 'success',
  showToast: false,
  aiChatMessages: [{role:'ai',text:'Hello! I\'m your AI Research Helper. I can assist with formulating research questions, selecting databases, building search strategies, and suggesting related topics. How can I help you today?'}],
  aiInput: '',
  arSelectedBook: null,
  semanticQuery: '',
  semanticResults: null,
  studentSubscriptions: ['B003'],
  notifPrefs: {dueReminders:true,stockAlerts:true,systemUpdates:false},

function getBook(id){return BOOKS.find(b=>b.id===id)}
function getStudent(id){return STUDENTS.find(s=>s.id===id)}
function isOverdue(loan){return !loan.returned && new Date(loan.dueDate)<new Date()}
function daysUntilDue(loan){return Math.ceil((new Date(loan.dueDate)-new Date())/(1000*60*60*24))}
function calcFine(loan){if(!isOverdue(loan))return 0;return Math.abs(daysUntilDue(loan))*2.5}

function showToast(msg,type='success'){
  state.toastMsg=msg;state.toastType=type;state.showToast=true;
  render();setTimeout(()=>{state.showToast=false;render()},3000);
}

// ===== RENDER =====
function render(){
  const app=document.getElementById('app');
  app.innerHTML=state.role==='admin'?renderAdmin():renderStudent();
  lucide.createIcons();
  attachEvents();
}

// ===== ADMIN =====
function renderAdmin(){
  const pages={dashboard:adminDashboard,inventory:adminInventory,borrowers:adminBorrowers,fines:adminFines,analytics:adminAnalytics,demand:adminDemand,notifications:adminNotifications};
  const menuItems=[
    {key:'dashboard',icon:'layout-dashboard',label:'Dashboard'},
    {key:'inventory',icon:'book-open',label:'Inventory'},
    {key:'borrowers',icon:'users',label:'Borrowers'},
    {key:'fines',icon:'banknote',label:'Fine Clearance'},
    {key:'analytics',icon:'bar-chart-3',label:'Analytics'},
    {key:'demand',icon:'trending-up',label:'Demand Predictor'},
    {key:'notifications',icon:'bell',label:'Notifications'},
  ];
  const unread=NOTIFICATIONS.filter(n=>!n.read).length;
  return `
  <div class="h-full flex flex-col bg-white">

  </div>

function adminDashboard(){
  const totalBooks=BOOKS.reduce((a,b)=>a+b.totalCopies,0);
  const activeLoans=LOANS.filter(l=>!l.returned).length;
  const overdue=LOANS.filter(l=>isOverdue(l)).length;
  const totalFines=STUDENTS.reduce((a,s)=>a+s.fines,0);
  const stats=[
    {label:'Total Books',value:totalBooks,icon:'book-open',color:'accent'},
    {label:'Active Loans',value:activeLoans,icon:'arrow-right-left',color:'info'},
    {label:'Overdue',value:overdue,icon:'alert-triangle',color:'danger'},
    {label:'Fines Pending',value:'$'+totalFines.toFixed(2),icon:'banknote',color:'accent'},
  ];
  return `
  <h2 class="serif text-2xl mb-6">Admin Dashboard</h2>
  <div class="grid grid-cols-4 gap-4 mb-6">${stats.map(s=>`
    <div class="card glow flex items-center gap-4">
      <div class="w-11 h-11 rounded-xl bg-${s.color}/10 flex items-center justify-center"><i data-lucide="${s.icon}" style="width:22px;height:22px" class="text-${s.color}"></i></div>
      <div><div class="text-2xl font-bold">${s.value}</div><div class="text-muted text-xs">${s.label}</div></div>
    </div>`).join('')}</div>
  <div class="grid grid-cols-3 gap-4">
    <div class="card col-span-2">
      <h3 class="serif text-lg mb-3">System Alerts</h3>
      ${NOTIFICATIONS.filter(n=>!n.read).map(n=>`
        <div class="flex items-start gap-3 py-2 border-b border-surface last:border-0">
          <div class="w-2 h-2 rounded-full bg-${n.type==='overdue'?'danger':n.type==='stock'?'accent':'info'} mt-2 flex-shrink-0"></div>
          <div><div class="text-sm">${n.msg}</div><div class="text-muted text-xs">${n.time}</div></div>
        </div>`).join('')}
      ${NOTIFICATIONS.filter(n=>!n.read).length===0?'<p class="text-muted text-sm">No new alerts</p>':''}
    </div>
    <div class="card">
      <h3 class="serif text-lg mb-3">Loan Period Breakdown</h3>
      <div class="space-y-3">
        <div><div class="flex justify-between text-sm mb-1"><span>On Time</span><span class="text-success">${activeLoans-overdue}</span></div><div class="progress-bar"><div class="progress-fill bg-success" style="width:${activeLoans?(activeLoans-overdue)/activeLoans*100:0}%"></div></div></div>
        <div><div class="flex justify-between text-sm mb-1"><span>Overdue</span><span class="text-danger">${overdue}</span></div><div class="progress-bar"><div class="progress-fill bg-danger" style="width:${activeLoans?overdue/activeLoans*100:0}%"></div></div></div>
        <div><div class="flex justify-between text-sm mb-1"><span>Returned</span><span class="text-muted">${LOANS.filter(l=>l.returned).length}</span></div><div class="progress-bar"><div class="progress-fill bg-muted" style="width:${LOANS.length?LOANS.filter(l=>l.returned).length/LOANS.length*100:0}%"></div></div></div>
      </div>
    </div>
  </div>`;
}

function adminInventory(){
  const cats=['All',...new Set(BOOKS.map(b=>b.category))];
  const filtered=BOOKS.filter(b=>{
    if(state.inventoryFilter!=='All'&&b.category!==state.inventoryFilter)return false;
    if(state.searchQuery&&!b.title.toLowerCase().includes(state.searchQuery.toLowerCase())&&!b.author.toLowerCase().includes(state.searchQuery.toLowerCase()))return false;
    return true;
  });
  return `
  <div class="flex items-center justify-between mb-6">
    <h2 class="serif text-2xl">Inventory Manager</h2>
    <button id="addBookBtn" class="btn-primary flex items-center gap-2"><i data-lucide="plus" style="width:16px;height:16px"></i>Add Book</button>
  </div>
  <div class="flex gap-3 mb-5">
    <div class="relative flex-1"><i data-lucide="search" style="width:16px;height:16px" class="absolute left-3 top-1/2 -translate-y-1/2 text-muted"></i><input id="invSearch" placeholder="Search books or authors..." class="w-full pl-10" value="${state.searchQuery}"></div>
    <select id="invFilter" class="w-48">${cats.map(c=>`<option ${state.inventoryFilter===c?'selected':''}>${c}</option>`).join('')}</select>
  </div>
  <div class="card overflow-hidden p-0">
    <table class="w-full text-sm">
      <thead><tr class="border-b border-surface text-muted text-left">
        <th class="p-3">Title</th><th class="p-3">Author</th><th class="p-3">Category</th><th class="p-3">Stock</th><th class="p-3">Demand</th><th class="p-3">Actions</th>
      </tr></thead>
      <tbody>${filtered.map(b=>`
        <tr class="border-b border-surface/50 hover:bg-surface/30 transition">
          <td class="p-3 font-medium">${b.title}</td>
          <td class="p-3 text-muted">${b.author}</td>
          <td class="p-3"><span class="badge bg-surface text-muted">${b.category}</span></td>
          <td class="p-3"><span class="${b.stock===0?'text-danger font-bold':b.stock<=2?'text-accent':'text-success'}">${b.stock}/${b.totalCopies}</span></td>
          <td class="p-3"><div class="flex items-center gap-2"><div class="progress-bar w-16"><div class="progress-fill ${b.demand>80?'bg-danger':b.demand>50?'bg-accent':'bg-success'}" style="width:${b.demand}%"></div></div><span class="text-xs text-muted">${b.demand}%</span></div></td>
          <td class="p-3 flex gap-2"><button class="text-muted hover:text-accent transition" title="Edit"><i data-lucide="edit" style="width:15px;height:15px"></i></button><button data-delete="${b.id}" class="text-muted hover:text-danger transition" title="Remove"><i data-lucide="trash-2" style="width:15px;height:15px"></i></button></td>
        </tr>`).join('')}</tbody>
    </table>
  </div>`;
}

function adminBorrowers(){
  const active=LOANS.filter(l=>!l.returned);
  return `
  <h2 class="serif text-2xl mb-6">Active Borrowers</h2>
  <div class="card p-2 mb-4 bg-surface/50 text-sm flex items-center gap-2"><i data-lucide="shield-alert" style="width:16px;height:16px" class="text-accent"></i><span><strong class="text-accent">Fine Blocker:</strong> Students with fines ≥ $30 are automatically blocked from new borrowing until cleared.</span></div>
  <div class="card overflow-hidden p-0">
    <table class="w-full text-sm">
      <thead><tr class="border-b border-surface text-muted text-left">
        <th class="p-3">Student</th><th class="p-3">Book</th><th class="p-3">Borrowed</th><th class="p-3">Due</th><th class="p-3">Status</th><th class="p-3">Renewals</th>
      </tr></thead>
      <tbody>${active.map(l=>{
        const b=getBook(l.bookId),s=getStudent(l.studentId),od=isOverdue(l);
        return `<tr class="border-b border-surface/50">
          <td class="p-3"><div class="font-medium">${s?.name||'—'}</div><div class="text-muted text-xs">${s?.dept||''}</div></td>
          <td class="p-3">${b?.title||'—'}</td>
          <td class="p-3 text-muted">${l.borrowDate}</td>
          <td class="p-3 ${od?'text-danger font-bold':''}">${l.dueDate}</td>
          <td class="p-3">${s?.blocked?'<span class="badge bg-danger/20 text-danger">Blocked</span>':od?'<span class="badge bg-danger/20 text-danger">Overdue</span>':'<span class="badge bg-success/20 text-success">Active</span>'}</td>
          <td class="p-3">${l.renewed}/2</td>
        </tr>`;}).join('')}</tbody>
    </table>
  </div>`;
}

function adminFines(){
  const studentsWithFines=STUDENTS.filter(s=>s.fines>0);
  const totalFines=STUDENTS.reduce((a,s)=>a+s.fines,0);
  return `
  <h2 class="serif text-2xl mb-6">Fine Clearance</h2>
  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="card"><div class="text-muted text-xs mb-1">Total Outstanding</div><div class="text-2xl font-bold text-accent">$${totalFines.toFixed(2)}</div></div>
    <div class="card"><div class="text-muted text-xs mb-1">Students with Fines</div><div class="text-2xl font-bold">${studentsWithFines.length}</div></div>
    <div class="card"><div class="text-muted text-xs mb-1">Blocked Accounts</div><div class="text-2xl font-bold text-danger">${STUDENTS.filter(s=>s.blocked).length}</div></div>
  </div>
  <div class="card overflow-hidden p-0">
    <table class="w-full text-sm">
      <thead><tr class="border-b border-surface text-muted text-left">
        <th class="p-3">Student</th><th class="p-3">Department</th><th class="p-3">Fine Amount</th><th class="p-3">Status</th><th class="p-3">Actions</th>
      </tr></thead>
      <tbody>${studentsWithFines.map(s=>`
        <tr class="border-b border-surface/50">
          <td class="p-3 font-medium">${s.name}</td>
          <td class="p-3 text-muted">${s.dept}</td>
          <td class="p-3 text-accent font-bold">$${s.fines.toFixed(2)}</td>
          <td class="p-3">${s.blocked?'<span class="badge bg-danger/20 text-danger">Blocked</span>':'<span class="badge bg-accent/20 text-accent">Pending</span>'}</td>
          <td class="p-3"><button data-clearfine="${s.id}" class="btn-primary text-xs py-1 px-3">Clear Fine</button></td>
        </tr>`).join('')}</tbody>
    </table>
  </div>`;
}

function adminAnalytics(){
  const maxLoans=Math.max(...ANALYTICS_MONTHLY.map(m=>m.loans));
  const topTopics=[{topic:'Machine Learning',count:87},{topic:'Organic Chemistry',count:64},{topic:'Microeconomics',count:58},{topic:'Molecular Biology',count:42}];
  const segments=[{label:'Undergrad',pct:62,color:'accent'},{label:'Postgrad',pct:28,color:'info'},{label:'Faculty',pct:10,color:'success'}];
  return `
  <h2 class="serif text-2xl mb-6">Analytics Dashboard</h2>

        <button data-togglepref="${p.key}" class="w-11 h-6 rounded-full transition relative ${state.notifPrefs[p.key]?'bg-accent':'bg-surface'}">
          <div class="w-5 h-5 rounded-full bg-white absolute top-0.5 transition-all ${state.notifPrefs[p.key]?'left-5.5':'left-0.5'}" style="${state.notifPrefs[p.key]?'left:22px':'left:2px'}"></div>
        </button>
      </div>`).join('')}</div>
  </div>`;
}

function toast(){
  return `<div class="toast ${state.toastType==='success'?'bg-success text-ink':'bg-danger text-white'}">${state.toastMsg}</div>`;
}

// ===== EVENTS =====
function attachEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{state.adminPage=el.dataset.nav;render()});
  document.querySelectorAll('[data-snav]').forEach(el=>el.onclick=()=>{state.studentPage=el.dataset.snav;render()});
  const sr=document.getElementById('switchRole');
  if(sr)sr.onclick=()=>{state.role=state.role==='admin'?'student':'admin';render()};

  const invSearch=document.getElementById('invSearch');
  if(invSearch)invSearch.oninput=e=>{state.searchQuery=e.target.value;render();setTimeout(()=>{const el=document.getElementById('invSearch');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},0)};
  const invFilter=document.getElementById('invFilter');
  if(invFilter)invFilter.onchange=e=>{state.inventoryFilter=e.target.value;render()};

  const addBtn=document.getElementById('addBookBtn');
  if(addBtn)addBtn.onclick=()=>{state.showAddBookModal=true;render()};

  const closeModal=document.getElementById('closeModal');
  if(closeModal)closeModal.onclick=()=>{state.showAddBookModal=false;state.showFineModal=null;render()};
  const backdrop=document.getElementById('modalBackdrop');
  if(backdrop)backdrop.onclick=e=>{if(e.target===backdrop){state.showAddBookModal=false;state.showFineModal=null;render()}};

  const addForm=document.getElementById('addBookForm');
  if(addForm)addForm.onsubmit=e=>{
    e.preventDefault();
    const t=document.getElementById('nb-title').value,a=document.getElementById('nb-author').value,c=document.getElementById('nb-cat').value,isbn=document.getElementById('nb-isbn').value,copies=parseInt(document.getElementById('nb-copies').value);
    BOOKS.push({id:'B'+String(BOOKS.length+1).padStart(3,'0'),title:t,author:a,category:c,isbn,stock:copies,totalCopies:copies,demand:0,location:{floor:1,shelf:'NEW',row:1},demandScore:10,examSeasonImpact:'Low'});
    state.showAddBookModal=false;showToast('Book added successfully!');
  };

  document.querySelectorAll('[data-clearfine]').forEach(el=>el.onclick=()=>{state.showFineModal=el.dataset.clearfine;render()});
  const confirmClear=document.getElementById('confirmClearFine');
  if(confirmClear)confirmClear.onclick=()=>{
    const s=getStudent(state.showFineModal);
    if(s){s.fines=0;s.blocked=false;s.standing='Good';state.showFineModal=null;showToast('Fine cleared successfully!')}
  };

  document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{
    const idx=BOOKS.findIndex(b=>b.id===el.dataset.delete);
    if(idx>-1){BOOKS.splice(idx,1);showToast('Book removed','success')}
  });

  document.querySelectorAll('[data-markread]').forEach(el=>el.onclick=()=>{
    const n=NOTIFICATIONS.find(n=>n.id===el.dataset.markread);
    if(n){n.read=true;render()}
  });

  // Student events
  const semBtn=document.getElementById('semanticSearchBtn');
  const semInput=document.getElementById('semanticInput');
  if(semBtn)semBtn.onclick=()=>{
    const q=(semInput?.value||'').toLowerCase().trim();
    state.semanticQuery=q;
    const match=Object.entries(TOPIC_CLUSTERS).find(([k])=>q.includes(k));
    state.semanticResults=match?{topic:match[0],...match[1]}:null;
    if(!match&&q)state.semanticResults={topic:q,books:BOOKS.filter(b=>b.title.toLowerCase().includes(q)||b.category.toLowerCase().includes(q)).map(b=>b.id).slice(0,4),related:['related topic 1','related topic 2']};
    render();
  };
  document.querySelectorAll('[data-stag]').forEach(el=>el.onclick=()=>{state.semanticQuery=el.dataset.stag;state.semanticResults=null;render();document.getElementById('semanticSearchBtn')?.click()});

  document.querySelectorAll('[data-renew]').forEach(el=>el.onclick=()=>{
    const l=LOANS.find(l=>l.id===el.dataset.renew);
    if(l&&l.renewed<2){l.renewed++;const d=new Date(l.dueDate);d.setDate(d.getDate()+14);l.dueDate=d.toISOString().split('T')[0];showToast('Loan renewed! New due date: '+l.dueDate)}
  });

  document.querySelectorAll('[data-unsub]').forEach(el=>el.onclick=()=>{
    state.studentSubscriptions=state.studentSubscriptions.filter(id=>id!==el.dataset.unsub);showToast('Unsubscribed');
  });

  const aiSend=document.getElementById('aiSendBtn');
  const aiIn=document.getElementById('aiInput');
  if(aiSend)aiSend.onclick=()=>sendAI();
  if(aiIn)aiIn.onkeydown=e=>{if(e.key==='Enter')sendAI()};
  document.querySelectorAll('[data-aiprompt]').forEach(el=>el.onclick=()=>{state.aiInput=el.dataset.aiprompt;render();setTimeout(sendAI,50)});

  const arSel=document.getElementById('arBookSelect');
  if(arSel)arSel.onchange=e=>{state.arSelectedBook=e.target.value||null;render()};

  document.querySelectorAll('[data-togglepref]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.togglepref;state.notifPrefs[k]=!state.notifPrefs[k];render();
  });
}

function sendAI(){
  const input=document.getElementById('aiInput');
  const text=(input?.value||state.aiInput||'').trim();
  if(!text)return;
  state.aiChatMessages.push({role:'user',text});
  state.aiInput='';
  const response=AI_RESPONSES[state.aiChatMessages.filter(m=>m.role==='ai').length%AI_RESPONSES.length];
  setTimeout(()=>{state.aiChatMessages.push({role:'ai',text:response});render();const chat=document.getElementById('aiChat');if(chat)chat.scrollTop=chat.scrollHeight},600);
  render();
}

});
